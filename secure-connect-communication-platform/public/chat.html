<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Connect Chat</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:35px auto;padding:0 16px;color:#202938}
input,button{padding:10px;margin:5px 4px 5px 0}input{border:1px solid #cbd5e1;border-radius:6px}
button{border:0;border-radius:6px;background:#2457a7;color:white;cursor:pointer}
#messages{border:1px solid #cbd5e1;border-radius:8px;height:300px;overflow-y:auto;padding:12px;margin:14px 0}
.message{padding:6px 0;border-bottom:1px solid #eef2f7}.muted{color:#64748b}
</style></head><body>
<h1>Secure Connect Chat</h1><p class="muted">Sign in using the API and paste the returned JWT token below.</p>
<input id="token" type="password" placeholder="JWT token" style="width:min(430px,90%)"><button id="connect">Connect</button><span id="status">Not connected</span>
<p><input id="room" value="general" placeholder="Room name"><button id="join">Join room</button></p>
<div id="messages" aria-live="polite"></div>
<input id="message" placeholder="Type a message..." maxlength="500" style="width:min(520px,75%)"><button id="send">Send</button>
<script src="/socket.io/socket.io.js"></script><script>
let socket;const status=document.getElementById("status"),messages=document.getElementById("messages");
function add(text){const div=document.createElement("div");div.className="message";div.textContent=text;messages.appendChild(div);messages.scrollTop=messages.scrollHeight;}
document.getElementById("connect").onclick=()=>{
 const token=document.getElementById("token").value.trim();if(!token)return alert("Paste your login token.");
 if(socket)socket.disconnect();socket=io({auth:{token}});
 socket.on("connect",()=>{status.textContent="Connected";add("Connected to chat server.");});
 socket.on("connect_error",e=>{status.textContent="Connection failed";add("Connection error: "+e.message);});
 socket.on("disconnect",()=>status.textContent="Disconnected");
 socket.on("system-message",d=>add("[System] "+d.message));
 socket.on("chat-message",d=>add("["+d.room+"] "+d.username+": "+d.message));
 socket.on("chat-error",d=>add("[Error] "+d.message));
};
document.getElementById("join").onclick=()=>{if(!socket||!socket.connected)return alert("Connect first.");socket.emit("join-room",document.getElementById("room").value||"general");};
function send(){if(!socket||!socket.connected)return alert("Connect first.");const input=document.getElementById("message"),message=input.value.trim();if(!message)return;socket.emit("chat-message",{room:document.getElementById("room").value||"general",message});input.value="";}
document.getElementById("send").onclick=send;
document.getElementById("message").addEventListener("keydown",e=>{if(e.key==="Enter")send();});
</script></body></html>
